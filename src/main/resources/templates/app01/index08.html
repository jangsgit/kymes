            flex: 2;
            min-width: 0;

        /* 라벨(제목) 셀: 한글은 단어 단위로만 줄바꿈 */
        .label,
        dt, th {
        word-break: keep-all;      /* 한글 글자 단위 쪼개기 방지 */
        overflow-wrap: normal;     /* anywhere/break-word 방지 */
        white-space: normal;       /* 필요하면 줄은 바뀌되 '단어' 기준 */
        line-height: 1.2;
        }

        /* 라벨 칸이 너무 좁으면 최소폭도 같이 */
        .label-cell,
        dt, th {
        min-width: 170px;           /* 상황에 맞게 90~120px 조절 */

    function addFile() {
    
        const fileDivs = $('div[data-name="fileDiv"]');
        if (fileDivs.length > 2) {
            alert('파일은 최대 세 개까지 업로드 할 수 있습니다.');
            return false;
        } 
        fileIdx++;
        const fileHtml = `
        <div data-name="fileDiv" class="form-group filebox bs3-primary">
            <div class="table table_style3">
                <table>
                    <tr>
                        <th>첨부사진 #${fileIdx}</th>

                            <div class="col-sm-15">
                                <input type="text" class="upload-name" value="파일 찾기" readonly />
                                <label for="file_${fileIdx}" class="control-label">찾아보기</label>
                                <input type="file" name="files_${fileIdx}" id="file_${fileIdx}" multiple='multiple'  class="upload-hidden" onchange="changeFilename(this)" />
    
                                <button type="button" onclick="removeFile(this)" class="btn btn-bordered btn-xs visible-xs-inline visible-sm-inline visible-md-inline visible-lg-inline">
                                    <i class="fa fa-minus" aria-hidden="true"></i>

                        </td>
                    </tr>
                </table>
            </div>
        </div>
        `;
    
    
        $('#btnDiv').before(fileHtml);
    }
    
    function removeFile(elem) {
    
        const prevTag = $(elem).prev().prop('tagName');
        if (prevTag === 'BUTTON') {
            const file = $(elem).prevAll('input[type="file"]');
            const filename = $(elem).prevAll('input[type="text"]');
            file.val('');
            filename.val('파일 찾기');
            return false;
        }
    
        const target = $(elem).parents('div[data-name="fileDiv"]');
        fileIdx = fileIdx - 1;
        target.remove();
    }
    
    
    function deleteFile(elem, arg1, arg2) {
    
        if (!confirm("파일을 삭제하시겠습니까?")) {
            return ;
        }
    
        //도면 파일 삭제
        $.ajax({
            url: '/appadmod/filedel',
            type:"POST",
            data: {
                "actidxz"     : arg1 ,
                "actnseqz"    : arg2 ,
                "actnflagz"    : "NN"
            },
            async:false,
            success:function(data){
                if(data == "success"){
                    // console.log("deletefile", data);
                    const target = $(elem).parents('div[data-name="fileDiv"]');
                    target.remove();
                }else{
                    alert("삭제중 오류가 발생했습니다. 관리자에게 문의하세요.")
                }
            },error:function(e){
                console.log('error',e);
            }
        }).done(function(fragment){
    
        })
    
    
    }

        file = $(file);

        const target = file.prevAll('input');
        target.val(filename);
    }
