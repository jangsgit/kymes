<head>
    <title>KyoungDuk MES</title>
    <style>
        .greenText span {
            color: #66DA26;
        }

        .redText span {
            color: #FF0000;
        }

        .grayText span {
            color: #8C8C8C;
        }

        .blueText span {
            color: #4374D9;
        }

        .yellowText span {
            color: #FFE400;
        }

        [data-ax5grid] [data-ax5grid-container="root"] [data-ax5grid-container="body"] [data-ax5grid-panel] table tr td [data-ax5grid-cellHolder] {
            font-size: 14px;
        }
        .card-text{
            margin-bottom: 10px;
        }

        .wj-flexgrid,
        canvas.wj-flexgrid {
            flex: 1 1 auto;
            min-height: 0;
            background-color: #f8f8f8;
        }

        .chart-wrapper {
            flex: 2;
            min-width: 0;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden; /* 혹시 몰라서 */
        }
        .inline-wrap {
            display: flex;
            align-items: center;
            gap: 8px;            /* 요소 간 간격 */
            flex-wrap: wrap;   /* 좁으면 자동 줄바꿈 */
        }

        .inline-wrap select,
        .inline-wrap input[type="text"],
        .inline-wrap input[type="date"] {
            flex: 1 1 140px;       /* 최소 140px 확보, 남는 폭은 균등 */
            min-width: 140px;
        }
        .radio-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        /* 월/주차 전용 */
        .month-week {
        gap: 6px;
        }

        .month-week .mw-select {
        flex: 0 0 90px;   /* 고정 폭 90px */
        min-width: 90px;
        max-width: 90px;
        }
 
        /* 라벨(제목) 셀: 한글은 단어 단위로만 줄바꿈 */
        .label,
        dt, th {
        word-break: keep-all;      /* 한글 글자 단위 쪼개기 방지 */
        overflow-wrap: normal;     /* anywhere/break-word 방지 */
        white-space: normal;       /* 필요하면 줄은 바뀌되 '단어' 기준 */
        line-height: 1.2;
        }

        /* 라벨 칸이 너무 좁으면 최소폭도 같이 */
        .label-cell,
        dt, th {
        min-width: 90px;           /* 상황에 맞게 90~120px 조절 */
        }


    </style>

    <script>
        // 숨겨진 input#intimebtn 클릭 → 팝업 오픈
        $(document).on('click', '#intimebtn', function () {
          const defaultData = {
            id: '',
            mode: 'new',
            State: 'draft',
            spjangcd: 'ZZ'
          };
      
          // ✅ 감싸지 말고 그대로 전달
          showTimeForm(defaultData);
        });
        function showTimeForm(data) {
            data = data || {};
            const templateId = 'intimeTemplate';

            const html = tmpl(templateId, data);
            const $nodes = $(html);

            // ✅ 템플릿에 style이 있으면 head로 올림(안 올리면 스타일 깨질 수 있음)
            $nodes.filter('style').appendTo('head');

            // ✅ 실제 팝업 본문(div)만 추출 (루트 노드 여러개 문제 해결)
            const $popup = $nodes.filter('.content_wrap.popup').first();
            if (!$popup.length) {
                alert('팝업 본문(.content_wrap.popup)을 찾지 못했습니다.');
                return;
            }

            // ✅ 오버레이+모달 컨테이너 생성
            const $overlay = $(`
                <div id="simpleModalOverlay"
                    style="position:fixed; inset:0; background:rgba(0,0,0,0.35);
                            display:flex; align-items:center; justify-content:center; z-index:99999;">
                <div id="simpleModalBox"
                    style="background:#fff; border-radius:10px; min-width:380px; max-width:90vw;
                            max-height:90vh; overflow:auto; box-shadow:0 10px 30px rgba(0,0,0,.25);">
                </div>
                </div>
            `);

            // ✅ 팝업 내용 삽입
            $overlay.find('#simpleModalBox').append($popup);

            // ✅ 닫기 버튼(#modal-close-button)이 템플릿에 있으니 연결
            $overlay.on('click', '#modal-close-button', function () {
                $overlay.remove();
            });

            // ✅ 바깥 클릭 시 닫기(원치 않으면 이 블록 삭제)
            $overlay.on('click', function (e) {
                if (e.target === this) $overlay.remove();
            });

            // ✅ DOM에 붙이기
            $('body').append($overlay);

            // ✅ 버튼 이벤트는 반드시 $popup 내부에서 찾기
            const $rwflagBtn = $popup.find('#rwflagBtn');
            $rwflagBtn.off('click').on('click', function () {
                const TIME_ZONE = 9 * 60 * 60 * 1000;
                const d = new Date();
                const date = new Date(d.getTime() + TIME_ZONE).toISOString().split('T')[0];
                const time = d.toTimeString().split(' ')[0];

                document.getElementById('startDate').value = date + ' ' + time;

                save_btn("1");
                //button_wfrdt.disabled = true;
                //button_wtrdt.disabled = false;

                $overlay.remove();
            });
        }

    </script>

        // 현재 선택된 날짜 + 5일
        function showCurrentDate(ctrl, days) {
            var ls_sdate = ctrl;  
            
            if(ls_sdate == null || ls_sdate.length == 0 || ls_sdate == ""){ 
                return;         
            }       
            var result = new Date(ls_sdate);  
            //const month = ls_sdate.toLocaleString('default', { month: 'long' });
            const month = (result.getMonth() + 1) + '월';  // 0~11 이라 +1
            const week = getISOWeek(result);                      // 1~53 (ISO
      
            document.getElementById('inmonth_sa').value = month;
            document.getElementById('inweeks_sa').value = week;   
        }  
        // ISO 주차(월요일 시작) 계산
        function getISOWeek(date = new Date()) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7; // Mon=1..Sun=7
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        } 
        function switchTab(tabId) {
            // 모든 탭 콘텐츠 숨김
            document.querySelectorAll('.tab-item').forEach(sec => {
                sec.style.display = 'none';
                sec.classList.remove('active');
            });

            // 모든 탭 링크 비활성화
            document.querySelectorAll('.tab-links a').forEach(a => {
                a.classList.remove('active');
            });

            // 선택된 탭 표시
            const target = document.querySelector(tabId);
            if (target) {
                target.style.display = 'block';
                target.classList.add('active');
            }

            // 선택된 탭 링크 활성화
            const link = document.querySelector(`.tab-links a[href="${tabId}"]`);
            if (link) {
                link.classList.add('active');
            }
        }
