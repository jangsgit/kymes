    function formatDate(rawDate) {
        if (!rawDate) return "";

        // 1️⃣ Date 객체일 경우 → YYYY-MM-DD로 변환
        if (rawDate instanceof Date) {
            const yyyy = rawDate.getFullYear();
            const mm = String(rawDate.getMonth() + 1).padStart(2, "0");
            const dd = String(rawDate.getDate()).padStart(2, "0");
            return `${yyyy}-${mm}-${dd}`;
        }

        // 2️⃣ 숫자(엑셀 날짜 코드 등)일 경우 → 변환 시도
        if (typeof rawDate === "number") {
            const date = new Date(rawDate);
            if (!isNaN(date)) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, "0");
            const dd = String(date.getDate()).padStart(2, "0");
            return `${yyyy}-${mm}-${dd}`;
            }
        }

        // 3️⃣ 문자열인 경우
        if (typeof rawDate === "string") {
            rawDate = rawDate.trim();

            if (rawDate.includes("/")) { // MM/DD/YYYY
            const [mm, dd, yyyy] = rawDate.split("/");
            return `${yyyy}-${mm.padStart(2, "0")}-${dd.padStart(2, "0")}`;
            }

            if (rawDate.includes("-")) { // 이미 YYYY-MM-DD
            return rawDate;
            }
        }

        // 4️⃣ 그 외 알 수 없는 형식은 그대로 반환
        return rawDate;
        }

function convert_date(arg_date){  
    var ls_arg_date = String(arg_date); 
    if(ls_arg_date == null || ls_arg_date.length == 0 || ls_arg_date == ""|| ls_arg_date == "null"){  
        return "";
    }  
    // Date 객체로 변환
    const dateObj = new Date(arg_date);

    // 년, 월, 일 추출 (월은 0부터 시작하므로 +1 필요)
    const year = dateObj.getFullYear();
    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
    const day = String(dateObj.getDate()).padStart(2, '0');

    // "YYYY-MM-DD" 형식으로 변환
    const formattedDate = `${year}${month}${day}`;
    arg_date = formattedDate; 
    return arg_date; 
}
