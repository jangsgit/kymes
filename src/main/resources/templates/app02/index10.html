    <style>
        .greenText span {
            color: #66DA26;
        }

        .redText span {
            color: #FF0000;
        }

        .grayText span {
            color: #8C8C8C;
        }

        .blueText span {
            color: #4374D9;
        }

        .yellowText span {
            color: #FFE400;
        }

        [data-ax5grid] [data-ax5grid-container="root"] [data-ax5grid-container="body"] [data-ax5grid-panel] table tr td [data-ax5grid-cellHolder] {
            font-size: 14px;
        }
        .card-text{
            margin-bottom: 10px;
        }

        .wj-flexgrid,
        canvas.wj-flexgrid {
            flex: 1 1 auto;
            min-height: 0;
            background-color: #f8f8f8;
        }

        .chart-wrapper {
            flex: 2;
            min-width: 0;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden; /* 혹시 몰라서 */
        }
        .inline-wrap {
            display: flex;
            align-items: center;
            gap: 8px;            /* 요소 간 간격 */
            flex-wrap: wrap;   /* 좁으면 자동 줄바꿈 */
        }

        .inline-wrap select,
        .inline-wrap input[type="text"],
        .inline-wrap input[type="date"] {
            flex: 1 1 140px;       /* 최소 140px 확보, 남는 폭은 균등 */
            min-width: 140px;
        }
        .radio-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        /* 월/주차 전용 */
        .month-week {
        gap: 6px;
        }

        .month-week .mw-select {
        flex: 0 0 90px;   /* 고정 폭 90px */
        min-width: 90px;
        max-width: 90px;
        }

        /* 테이블 아래 별도 섹션처럼 보이게 */
        .copy-panel {
        margin-top: 14px;
        border: 1px solid #e6e9ef;
        border-radius: 12px;
        background: #fff;
        padding: 14px 16px;
        box-shadow: 0 1px 2px rgba(0,0,0,.04);
        }

        .copy-panel__title {
        font-weight: 700;
        font-size: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eef1f6;
        margin-bottom: 12px;
        }

        .copy-panel__body {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        }

        .copy-panel__left {
        flex: 1;
        min-width: 320px;
        }

        .copy-label {
        font-weight: 600;
        margin-bottom: 6px;
        }

        .copy-controls {
        gap: 8px;
        flex-wrap: wrap;
        }

        /* 월/주차 더 작게(요청 반영) */
        .copy-controls .mw-select {
        flex: 0 0 90px;
        min-width: 90px;
        max-width: 90px;
        }

        .copy-hint {
        margin-top: 8px;
        font-size: 12px;
        color: #6b7280;
        }

        .copy-panel__right {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        }

        /* 버튼을 “액션 버튼”처럼 */
        .btn-copy {
        height: 40px;
        padding: 0 18px;
        border-radius: 10px;
        border: 1px solid #cfd6e4;
        background: #ffffff;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        }

        .btn-copy:hover {
        background: #f6f8fc;
        }

        /* 노트북/작은 화면에서는 버튼이 아래로 내려가도 깔끔 */
        @media (max-width: 1200px) {
        .copy-panel__body {
            flex-direction: column;
            align-items: stretch;
        }
        .copy-panel__right {
            justify-content: flex-start;
        }
        .btn-copy {
            width: 100%;
        }
        }

        /* 라벨(제목) 셀: 한글은 단어 단위로만 줄바꿈 */
        .label,
        dt, th {
        word-break: keep-all;      /* 한글 글자 단위 쪼개기 방지 */
        overflow-wrap: normal;     /* anywhere/break-word 방지 */
        white-space: normal;       /* 필요하면 줄은 바뀌되 '단어' 기준 */
        line-height: 1.2;
        }

        /* 라벨 칸이 너무 좁으면 최소폭도 같이 */
        .label-cell,
        dt, th {
        min-width: 170px;           /* 상황에 맞게 90~120px 조절 */
        }

    </style>

    function convert_date(arg_date){  
        var ls_arg_date = String(arg_date); 
        if(ls_arg_date == null || ls_arg_date.length == 0 || ls_arg_date == ""|| ls_arg_date == "null"){  
            return "";
        }  
        // Date 객체로 변환
        const dateObj = new Date(arg_date);

        // 년, 월, 일 추출 (월은 0부터 시작하므로 +1 필요)
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');

        // "YYYY-MM-DD" 형식으로 변환
        const formattedDate = `${year}${month}${day}`;
        arg_date = formattedDate; 
        return arg_date; 
        // var ls_arg_date = String(arg_date);

        function showCurrentDateFromInput(ctrl, days) {
            if (!ctrl || !ctrl.value) return;

            const ls_sdate = ctrl.value; // "2026-01-04"
            const [y, m, d] = ls_sdate.split('-').map(Number);
            if (!y || !m || !d) return;

            const date = new Date(y, m - 1, d);

            // ✅ 월 select 세팅: "1월" 형태
            const monthValue = (date.getMonth() + 1) + '월';
            console.log(monthValue)
            const inmonth = document.getElementById('inmonth');
            if (inmonth) inmonth.value = monthValue;
 
            var result = new Date(ls_sdate);             
            const weekOfMonth = getWeekOfMonth(result); 
            document.getElementById('inweeks').value = weekOfMonth  ; 

            // ✅ (선택) 생산종료일 자동 계산: 시작일 + days
            // 필요 없으면 아래 블록 삭제하세요.
            if (typeof days === 'number' && !isNaN(days)) {
                const ed = new Date(date);
                ed.setDate(ed.getDate() + days);

                const yyyy = ed.getFullYear();
                const mm = String(ed.getMonth() + 1).padStart(2, '0');
                const dd = String(ed.getDate()).padStart(2, '0');

                const prodEdate = document.getElementById('prod_edate');
                if (prodEdate) prodEdate.value = `${yyyy}-${mm}-${dd}`;
            }
            }

        function getWeekOfMonth(date) { 
            const startDate = new Date(date.getFullYear(), date.getMonth(), 1);
            const dayOfWeek = startDate.getDay(); 
            const dayOfMonth = date.getDate();
            return Math.ceil((dayOfMonth + dayOfWeek) / 7);
        }
