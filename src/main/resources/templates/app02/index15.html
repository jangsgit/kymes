<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout_page}"> 

<head>
    <title>KyoungDuk MES</title>
    <style>
        .greenText span {
            color: #66DA26;
        }

        .redText span {
            color: #FF0000;
        }

        .grayText span {
            color: #8C8C8C;
        }

        .blueText span {
            color: #4374D9;
        }

        .yellowText span {
            color: #FFE400;
        }

        [data-ax5grid] [data-ax5grid-container="root"] [data-ax5grid-container="body"] [data-ax5grid-panel] table tr td [data-ax5grid-cellHolder] {
            font-size: 14px;
        }
        .card-text{
            margin-bottom: 10px;
        }

        .wj-flexgrid,
        canvas.wj-flexgrid {
            flex: 1 1 auto;
            min-height: 0;
            background-color: #f8f8f8;
        }

        .chart-wrapper {
            flex: 2;
            min-width: 0;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden; /* 혹시 몰라서 */
        }
    </style>
</head>
<th:block layout:fragment="content"> 
    <!--- (레이아웃) Contents 영역 -->
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>원자재입출고등록</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img src="/images/icon/ico-nav-home.svg" alt="홈아이콘"></li>
                <li>생산관리</li>
                <li>원자재입출고등록</li>
            </ul>
        </div>
 

        <div style="display: flex; gap: 5px">
            <section class="section" style="width: 40%;">
              <div class="section-top">
                <div class="search-wrap">
                  <dl>
                    <dt>
                      <label>코드</label>
                    </dt>
                    <dd>
                      <div class="srch-box">
                        <input type="text" class="form-control2" id="txtKeyword" name="txtKeyword">
                      </div>
                    </dd>
                  </dl>
      
                  <dl>
                    <dt><span class="eq"></span></dt>
                    <dd>
                      <li>
                        <a class="btn btn-delete" title="검색" id="retrieveBtn" onclick="searchList_rtn('B'); return false">
                          <img src="/images/icon/btn-srch.svg"  alt="검색 아이콘" >
                          검색
                        </a>
                      </li>
                    </dd>
                  </dl>
                </div>
      
              </div> <!--//section-top end -->
              <div class="container-fluid">  
                <img src="/img/waiting_page.png"  style="width: 50%;" >
              </div>
              <div class="btn-wrap">
              </div>
            </section> 
          </div>

    </div> <!--//layout-contents end -->
    <footer style="margin-top:5px;">
        <p>Copyrightⓒ DaesanSystem corp. All rights reserved.</p>
    </footer>
    <div style="height: 10px"></div>

    

</th:block>
 
<th:block layout:fragment="scripts">
    <script src="/resource/apexcharts/apexcharts.3.26.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <th:block th:replace="/common/columns_setting :: columns_setting"></th:block>
    <th:block th:replace="/common/popup_machnm :: popup_machnm"></th:block>
    <th:block th:replace="/common/popup_addinfo :: popup_addinfo"></th:block>
 

  

</th:block>

</html>
