          var ls_psize  =  document.getElementById('psize').value; 
          var ls_punit  =  document.getElementById('punit').value; 
          var ls_qty    =  document.getElementById('qty').value; 
          var ls_cqty   =  document.getElementById('cqty').value;

          var ls_remark  =  document.getElementById('remark').value;    
          var ls_istore =  document.getElementById('istore').value;  
          var ls_ostore =  document.getElementById('ostore').value;
          var ls_wonflag =  document.getElementById('wonflag').value;

                      alert("입고수량을 입력하세요")

                      return ;

      function save_fnc(){ 
          var ls_custcd = "KDMES";
          var ls_spjangcd = "ZZ";
          // var ls_inibgdate = document.getElementById('ibgdate').value; 
          var ls_inibgdate     =  $('#ibgdate').val().replace(/-/g, '');  //convert_date(wibgdate.value); 
          var ls_inibgnum = document.getElementById('ibgnum').value; 
          var ls_lotno   = document.getElementById('lotno').value; 
          var ls_inpcode   = document.getElementById('pcode').value;              //품목코드
          var ls_inpname   = document.getElementById('pname').value; 
          var ls_inpsize   = document.getElementById('psize').value; 
          var ls_popwotqt   = document.getElementById('popwotqt').value;          //출고수량
          //var ls_popwkotDate   = document.getElementById('popwkotDate').value;    //출고일자 \                
          var ls_popwkotDate     =  $('#popwkotDate').val().replace(/-/g, '');  //convert_date(popwkotDate.value);    
          var ls_popseq   = document.getElementById('popseq').value;              //순번                
          var ls_inwinqt   = document.getElementById('qty').value; //입고량
          var ls_inwotqt   = document.getElementById('cqty').value; //기출고량 
          if(!ls_popwotqt){
              ls_popwotqt = 0;
          }else{ 
              if(isNaN(ls_popwotqt)){
                  ls_popwotqt = 0;
              }else{
                  ls_popwotqt = Number(ls_popwotqt);
              } 
          } 
          if(!ls_inwotqt){
              ls_inwotqt = 0;
          }else{ 
              if(isNaN(ls_inwotqt)){
                  ls_inwotqt = 0;
              }else{
                  ls_inwotqt = Number(ls_inwotqt);
              } 
          } 
          if(ls_inwinqt == 0) {
              alert("입고수량과 로트를 등록한 뒤 출고수량을 등록하세요")
              return 
          }
          if(ls_popwotqt == 0) {
              alert("출고수량을 입력하세요")
              return 
          }
          if(ls_inpcode == null || ls_inpcode.length == 0 || ls_inpcode == ""){
              alert("품목을 입력하세요")
              return 
          }
          if(ls_lotno == null || ls_lotno.length == 0 || ls_lotno == ""){
              alert("로트를 입력하세요")
              return 
          }
          ls_inwinqt = Number(ls_inwinqt);
          ls_inwotqt = Number(ls_inwotqt);   
          if(ls_inwinqt < ls_inwotqt + ls_popwotqt){ 
              alert("입고수량을 초과 했습니다.")
              return 
          } 
          

          $.ajax({
              url: '/app02m/index15/chulsave',
              type:"POST", 
              data: {
                  "custcd"        : ls_custcd ,
                  "spjangcd"      : ls_spjangcd,
                  "inibgdate"     : ls_inibgdate ,
                  "inibgnum"      : ls_inibgnum ,
                  "inlotno"       : ls_lotno ,
                  "inpcode"       : ls_inpcode , 
                  "inpname"       : ls_inpname , 
                  "inpsize"       : ls_inpsize , 
                  "popwotqt"      : ls_popwotqt ,  
                  "popwkotDate"   : ls_popwkotDate , 
                  "seq"           : ls_popseq,
                  "inwotqt"         : ls_inwotqt  
              },
              async:false,
              success:function(data){ 
                  if(data == "error"){
                      alert("저장중 오류발생");
                      return
                  }  
                  var ll_cqty = Number(data);
                  document.getElementById('cqty').value = ll_cqty; 
                  searchListModal_rtn(); 
              },error:function(e){
                  console.log('error',e);
              }
          }).done(function(fragment){           

          })     


      }
