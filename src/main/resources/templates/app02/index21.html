    <title>KyoungDuk MES</title>
    <style>
        .greenText span {
            color: #66DA26;
        }

        .redText span {
            color: #FF0000;
        }

        .grayText span {
            color: #8C8C8C;
        }

        .blueText span {
            color: #4374D9;
        }

        .yellowText span {
            color: #FFE400;
        }

        [data-ax5grid] [data-ax5grid-container="root"] [data-ax5grid-container="body"] [data-ax5grid-panel] table tr td [data-ax5grid-cellHolder] {
            font-size: 14px;
        }
        .card-text{
            margin-bottom: 10px;
        }

        .wj-flexgrid,
        canvas.wj-flexgrid {
            flex: 1 1 auto;
            min-height: 0;
            background-color: #f8f8f8;
        }

        .chart-wrapper {
            flex: 2;
            min-width: 0;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden; /* 혹시 몰라서 */
        }
        /* 월/주차 전용 */
        .month-week {
        gap: 6px;
        }

        .month-week .mw-select {
        flex: 0 0 90px;   /* 고정 폭 90px */
        min-width: 90px;
        max-width: 90px;
        }

        /* 테이블 아래 별도 섹션처럼 보이게 */
        .copy-panel {
        margin-top: 14px;
        border: 1px solid #e6e9ef;
        border-radius: 12px;
        background: #fff;
        padding: 14px 16px;
        box-shadow: 0 1px 2px rgba(0,0,0,.04);
        }

        .copy-panel__title {
        font-weight: 700;
        font-size: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eef1f6;
        margin-bottom: 12px;
        }

        .copy-panel__body {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        }

        .copy-panel__left {
        flex: 1;
        min-width: 320px;
        }

        .copy-label {
        font-weight: 600;
        margin-bottom: 6px;
        }

        .copy-controls {
        gap: 8px;
        flex-wrap: wrap;
        }

        /* 월/주차 더 작게(요청 반영) */
        .copy-controls .mw-select {
        flex: 0 0 90px;
        min-width: 90px;
        max-width: 90px;
        }

        .copy-hint {
        margin-top: 8px;
        font-size: 12px;
        color: #6b7280;
        }

        .copy-panel__right {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        }

        /* 버튼을 “액션 버튼”처럼 */
        .btn-copy {
        height: 40px;
        padding: 0 18px;
        border-radius: 10px;
        border: 1px solid #cfd6e4;
        background: #ffffff;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        }

        .btn-copy:hover {
        background: #f6f8fc;
        }

        /* 노트북/작은 화면에서는 버튼이 아래로 내려가도 깔끔 */
        @media (max-width: 1200px) {
        .copy-panel__body {
            flex-direction: column;
            align-items: stretch;
        }
        .copy-panel__right {
            justify-content: flex-start;
        }
        .btn-copy {
            width: 100%;
        }
        }

        /* 라벨(제목) 셀: 한글은 단어 단위로만 줄바꿈 */
        .label,
        dt, th {
        word-break: keep-all;      /* 한글 글자 단위 쪼개기 방지 */
        overflow-wrap: normal;     /* anywhere/break-word 방지 */
        white-space: normal;       /* 필요하면 줄은 바뀌되 '단어' 기준 */
        line-height: 1.2;
        }

        /* 라벨 칸이 너무 좁으면 최소폭도 같이 */
        .label-cell,
        dt, th {
        min-width: 130px;           /* 상황에 맞게 90~120px 조절 */
        } 

        .inline-wrap.month-week {
            display: flex;
            gap: 6px;
        }

        .mw-select {
            width: 80px;
        }

        #searchtxt {
            height: 32px;
        }

        .btn.btn-delete {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
        }
        /* =========================
        검색영역(조회일자/발주번호/검색버튼) 전용
        ========================= */

        .search-wrap--inline{
        display:flex;
        align-items:center;
        gap:20px;
        flex-wrap:wrap;            /* 화면 좁아지면 자연스럽게 줄바꿈 */
        }

        /* dl 기본 마진/레이아웃 정리 */
        .search-wrap--inline .search-item{
        display:flex;
        align-items:center;
        gap:10px;
        margin:0;
        }

        /* ✅ 기존 공통 규칙(dt min-width:130px)을 이 영역에서만 무효화 */
        .search-wrap--inline dt{
        min-width:auto !important;
        margin:0;
        white-space:nowrap;
        font-weight:700;
        line-height:1;
        }

        /* dd 정리 */
        .search-wrap--inline dd{
        margin:0;
        }

        /* 월/주차를 한 줄로 */
        .search-wrap--inline .month-week{
        display:flex;
        align-items:center;
        gap:10px;
        }

        /* 셀렉트/인풋/버튼 높이 통일 */
        .search-wrap--inline .mw-select{
        width:120px;          /* 필요하면 100~140 사이로 조절 */
        height:40px;
        }

        .search-wrap--inline .search-input{
        width:180px;          /* ✅ 60% 대신 고정/최소폭 권장 */
        min-width:120px;
        height:40px;
        padding:0 12px;
        box-sizing:border-box;
        }

        /* 버튼 영역 */
        .search-wrap--inline .search-actions{
        display:flex;
        align-items:center;
        margin-left:auto;      /* ✅ 우측 끝으로 보내고 싶으면 유지 */
        }

        /* a.btn 모양 정리 */
        .search-wrap--inline .btn.btn-delete{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:6px;
        height:40px;
        padding:0 14px;
        border-radius:10px;
        white-space:nowrap;
        }

        /* 혹시 기존 HTML에 li가 남아있다면(현재 코드) li 기본스타일 제거 */
        .search-wrap--inline li{
        list-style:none;
        margin:0;
        padding:0;
        }

    </style>

    function convert_date(arg_date){ 
        var ls_arg_date = String(arg_date); 
        if(ls_arg_date == null || ls_arg_date.length == 0 || ls_arg_date == ""|| ls_arg_date == "null"){  
            return "";
        }  
        // Date 객체로 변환
        const dateObj = new Date(arg_date);

        // 년, 월, 일 추출 (월은 0부터 시작하므로 +1 필요)
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');

        // "YYYY-MM-DD" 형식으로 변환
        const formattedDate = `${year}${month}${day}`;
        arg_date = formattedDate; 
        return arg_date; 
    }

    function getWeekOfMonth(date) { 
            const startDate = new Date(date.getFullYear(), date.getMonth(), 1);
            const dayOfWeek = startDate.getDay(); 
            const dayOfMonth = date.getDate();
            return Math.ceil((dayOfMonth + dayOfWeek) / 7);
    }
