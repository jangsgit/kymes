<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"

      layout:decorate="~{layout_page}"> 

<head>
    <title>KyoungDuk MES</title>
    <style>
        .greenText span {
            color: #66DA26;
        }

        .redText span {
            color: #FF0000;
        }

        .grayText span {
            color: #8C8C8C;
        }

        .blueText span {
            color: #4374D9;
        }

        .yellowText span {
            color: #FFE400;
        }

        [data-ax5grid] [data-ax5grid-container="root"] [data-ax5grid-container="body"] [data-ax5grid-panel] table tr td [data-ax5grid-cellHolder] {
            font-size: 14px;
        }
        .card-text{
            margin-bottom: 10px;
        }

        .wj-flexgrid,
        canvas.wj-flexgrid {
            flex: 1 1 auto;
            min-height: 0;
            background-color: #f8f8f8;
        }

        .chart-wrapper {
            flex: 2;
            min-width: 0;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden; /* 혹시 몰라서 */
        }
        .inline-wrap {
            display: flex;
            align-items: center;
            gap: 8px;            /* 요소 간 간격 */
            flex-wrap: wrap;   /* 좁으면 자동 줄바꿈 */
        }

        .inline-wrap select,
        .inline-wrap input[type="text"],
        .inline-wrap input[type="date"] {
            flex: 1 1 140px;       /* 최소 140px 확보, 남는 폭은 균등 */
            min-width: 140px;
        }
        .radio-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        /* 월/주차 전용 */
        .month-week {
        gap: 6px;
        }

        .month-week .mw-select {
        flex: 0 0 90px;   /* 고정 폭 90px */
        min-width: 90px;
        max-width: 90px;
        }

        /* 테이블 아래 별도 섹션처럼 보이게 */
        .copy-panel {
        margin-top: 14px;
        border: 1px solid #e6e9ef;
        border-radius: 12px;
        background: #fff;
        padding: 14px 16px;
        box-shadow: 0 1px 2px rgba(0,0,0,.04);
        }

        .copy-panel__title {
        font-weight: 700;
        font-size: 15px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eef1f6;
        margin-bottom: 12px;
        }

        .copy-panel__body {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        }

        .copy-panel__left {
        flex: 1;
        min-width: 320px;
        }

        .copy-label {
        font-weight: 600;
        margin-bottom: 6px;
        }

        .copy-controls {
        gap: 8px;
        flex-wrap: wrap;
        }

        /* 월/주차 더 작게(요청 반영) */
        .copy-controls .mw-select {
        flex: 0 0 90px;
        min-width: 90px;
        max-width: 90px;
        }

        .copy-hint {
        margin-top: 8px;
        font-size: 12px;
        color: #6b7280;
        }

        .copy-panel__right {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        }

        /* 버튼을 “액션 버튼”처럼 */
        .btn-copy {
        height: 40px;
        padding: 0 18px;
        border-radius: 10px;
        border: 1px solid #cfd6e4;
        background: #ffffff;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        }

        .btn-copy:hover {
        background: #f6f8fc;
        }

        /* 노트북/작은 화면에서는 버튼이 아래로 내려가도 깔끔 */
        @media (max-width: 1200px) {
        .copy-panel__body {
            flex-direction: column;
            align-items: stretch;
        }
        .copy-panel__right {
            justify-content: flex-start;
        }
        .btn-copy {
            width: 100%;
        }
        }

        /* 라벨(제목) 셀: 한글은 단어 단위로만 줄바꿈 */
        .label,
        dt, th {
        word-break: keep-all;      /* 한글 글자 단위 쪼개기 방지 */
        overflow-wrap: normal;     /* anywhere/break-word 방지 */
        white-space: normal;       /* 필요하면 줄은 바뀌되 '단어' 기준 */
        line-height: 1.2;
        }

        /* 라벨 칸이 너무 좁으면 최소폭도 같이 */
        .label-cell,
        dt, th {
        min-width: 170px;           /* 상황에 맞게 90~120px 조절 */
        }

        @media print {
            @page {
                size: 11cm 6cm; /* 라벨 크기에 맞추기 */
                margin: 10;
            }
            body {
                margin: 0;
                padding: 0;
            }
            .print-area {
                width: 10cm;
                height: 2cm;
                border: none;
                padding: 0;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: center;
            }
            .barcode-image {
                width: 100%;
                height: 3.5cm;
            }
            .details {
                font-size: 14px;
                text-align: left;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                line-height: 2; /* 줄 간격 최소화 */
            }
            .details p {
                margin: 0; /* 간격을 줄이기 위해 여백을 조정 */
            }
            .details .item-barcode {
                font-weight: bold; /* 품명 굵게 표시 */
            }
            .details .item-name {
                font-weight: bold; /* 품명 굵게 표시 */
            }
            .details .item-cltnm {
                font-weight: bold; /* 품명 굵게 표시 */
            }
            .details .item-qty {
                font-weight: bold; /* 품명 굵게 표시 */
            }
        } 
    </style>

    function savechk_rtn(){

            alert("검사정보 자료를 선택하세요")
            return false
        }

        while (lotnoArr.length > 0) {
            lotnoArr.pop();
            // activeArr.pop();
            prod_qtyArr.pop();
            otqtyArr.pop();
            obqtyArr.pop();
            gqtyArr.pop();
            planArr.pop(); 
        }  
        for (var i = 0; i < chkTabBar.length; i++) { 
            lotnoArr[i]   = chkTabBar[i]._data.lotno;
            // activeArr[i]   = chkTabBar[i]._data.active;

            otqtyArr[i]  = chkTabBar[i]._data.otqty; 
            obqtyArr[i]  = chkTabBar[i]._data.obqty; 
            gqtyArr[i]  = chkTabBar[i]._data.gqty; 
            planArr[i]  = chkTabBar[i]._data.plan_no;

            }  
        }        
        return true        
    }
