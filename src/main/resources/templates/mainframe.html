    <style>
        .left {
            cursor: pointer;
        }

        .menu_area {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
            transform: translateX(0); /* 기본 위치 */
            opacity: 1;
            width: 250px; /* 메뉴 너비 */
            position: absolute; /* 왼쪽 고정 */
            left: 0;
            visibility: visible;
            pointer-events: auto;
        }

        /* 메뉴가 사라질 때 */
        .menu_area.hidden {
            transform: translateX(-250px); /* 부드럽게 왼쪽으로 사라짐 */
            opacity: 0;
            visibility: hidden;
            pointer-events: none; /* 클릭 방지 */
        }

        /* 컨텐츠 영역 */
        .con_area {
            transition: width 0.3s ease-in-out, left 0.3s ease-in-out;
            width: calc(100% - 250px); /* 기본적으로 메뉴 너비만큼 줄어든 상태 */
            left: 250px; /* 메뉴가 있을 때 기본 위치 */
        }

        /* 메뉴가 사라지면 컨텐츠 영역 확장 */
        .menu_area.hidden + .con_area {
            width: 100%;
            left: 0;
        }

        /* 부드럽게 나오는 애니메이션 */
        @keyframes menuFadeIn {
            0% {
                transform: translateX(-250px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .header-info {
            display: grid;
            grid-template-columns: 1fr auto; /* 왼쪽은 가변, 오른쪽은 고정 */
            align-items: center;
            width: 100%;
            gap: 10px;
        }


        /* 왼쪽 영역 */
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0; /* ✅ grid 셀에서 줄어들도록 */
        }

        /* 오른쪽 영역 */
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-menu {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .header-menu::-webkit-scrollbar {
            display: none; /* ✅ Chrome, Safari */
        }

        /* help 버튼 */
        a.help {
            background-color: #0056b3;
            color: #fff;
            border-radius: 5px;
            padding: 5px 10px;
            font-size: 13px;
            text-decoration: none;
            transition: 0.2s;
        }

        a.help:hover {
            background-color: #0066cc;
        }

        .header-menu .menu-btn {
            user-select: none;
        }

        .header-menu .menu-btn.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        //전역에 공유 + 준비 플래그 세팅
        window.nthTabs = nthTabs;
        window.__nthTabsReady = true;
        window.__nthOpenQueue = window.__nthOpenQueue || [];

        // 준비 완료 이벤트 (옵션)
        window.dispatchEvent(new Event('nthTabsReady'));

        //대기열 처리 (초기화 전에 열린 요청들 실행)
        const queue = window.__nthOpenQueue.splice(0);
        queue.forEach(args => window.openTabInMain(args));

        //탭 열기 함수는 그대로 사용
        window.openTabInMain = function ({ id, title, url, isbookmark=false, allowClose=true }) {
            if (!id) return;
            url = url || ('/gui/' + id + '/default');

            if (!window.__nthTabsReady || !window.nthTabs || typeof window.nthTabs.addTab !== 'function') {
                window.__nthOpenQueue.push({ id, title, url, isbookmark, allowClose });
                return;
            }

            if (window.nthTabs.isExistsTab('#' + id)) {
                window.nthTabs.toggleTab('#' + id);
            } else {
                window.nthTabs.addTab({
                    id,
                    title: title || id,
                    url,
                    active: true,
                    allowClose,
                    isbookmark: isbookmark ? 'true' : 'false'
                });
            }
        };

<script type="text/javascript">
    // 날씨 정보
    // fetchWeatherData();
    // 30분마다 날씨 정보 자동 갱신
    setInterval(fetchWeatherData, 1800000);

    function sseConnect(){

        const spjangcd = sessionStorage.getItem("spjangcd");

        const eventSource = new EventSource("/sse/subscribe?spjangcd="  + spjangcd);

        eventSource.onmessage = function (e){

            if(e.data){
                Notify.success(e.data);

            }

        }

        eventSource.onerror = function(err) {
            console.log('SSE 오류 발생, 재연결 시도 중...', err);
            eventSource.close();
            setTimeout(sseConnect, 3000);
        };
    }
    //sseConnect();

    // 날씨 정보를 서버에서 가져오는 함수
    function fetchWeatherData() {
        $.ajax({
            url: '/weather/current',
            type: 'GET',
            dataType: 'json',
            success: function (data) {
                // JSON 데이터 구조를 이용하여 각 항목에 대한 값을 추출
                //console.log(data); // 반환된 데이터를 콘솔에 출력
                const fullAddress = data.address;
                const shortAddress = fullAddress.split(" ")[0] + " " + fullAddress.split(" ")[1] + " " + fullAddress.split(" ")[2];
                $('#area').text(shortAddress); // 지역 정보 표시
                $('#temperature').html(`${data.T1H}<span class="celsius">℃</span>`);
                $('#precipitationProbability').html(data.POP ? `${data.POP}%` : '0%'); // 강수확률이 없는 경우 '0%'로 표시
                $('#humidity').html(`${data.REH}%`); // 습도를 표시할 때 '%'를 추가
                $('#windSpeed').html(`${data.WSD}m/s`); // 풍속을 표시할 때 'm/s'를 추가

                // 날씨 아이콘 업데이트
                updateWeatherIcon(data.SKY, data.PTY);

                const now = new Date();
                const formatted = now.getHours().toString().padStart(2, '0') + ':' +
                    now.getMinutes().toString().padStart(2, '0');
                $('#lastUpdated').text(`업데이트: ${formatted}`);
            },
            error: function (error) {
                console.error('Error fetching weather data:', error);
            }
        });
    }

    // 날씨 아이콘 업데이트 함수
    function updateWeatherIcon(skyValue, ptyValue) {
        // console.log("PTY Value:", ptyValue);
        // console.log("SKY Value:", skyValue);

        let iconPath = '/images/icon/weather/';
        let altText = '날씨 아이콘';

        // PTY 값에 따라 먼저 판단 (강수 형태 우선)
        if (ptyValue == '1') {
            iconPath += 'ico-wt4.svg'; // 비
            altText = '비';
        } else if (ptyValue == '3') {
            iconPath += 'ico-wt5.svg'; // 눈
            altText = '눈';
        } else if (ptyValue == '4') {
            iconPath += 'ico-wt7.svg'; // 소나기
            altText = '소나기';
        } else {
            // PTY 값이 0이거나 비어 있을 때는 SKY 값으로 판단
            if (skyValue == '1') {
                iconPath += 'ico-wt1.svg'; // 맑음
                altText = '맑음';
            } else if (skyValue == '2') {
                iconPath += 'ico-wt2.svg'; // 구름 조금
                altText = '구름 조금';
            } else if (skyValue == '3' || skyValue == '4') {
                iconPath += 'ico-wt3.svg'; // 구름 많음 또는 흐림
                altText = '구름 많음 또는 흐림';
            }
        }

        // 아이콘 업데이트
        const weatherIcon = $('#weatherIcon');
        weatherIcon.attr('src', iconPath);
        weatherIcon.attr('alt', altText);

    }


</script>

<script>
    let stompClient = null;
    let reconnectTimeout = null;
    let heartbeatInterval = null;
    let reconnectAttempts = 0;
    let isConnecting = false;

    // ✅ 메인 WebSocket 연결 함수
    function connectWS() {
        if (isConnecting || (stompClient && stompClient.connected)) return;
        isConnecting = true;

        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null; // 로그 최소화

        stompClient.connect({}, function () {
            reconnectAttempts = 0;
            isConnecting = false;

            // 구독
            stompClient.subscribe('/topic/joborder', function (message) {
                handleJobOrderMessage(JSON.parse(message.body));
            });

            // ping 유지
            clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                try {
                    if (stompClient.connected)
                        stompClient.send('/app/hello', {}, 'ping');
                } catch (_) { }
            }, 30000);
        }, function () {
            isConnecting = false;
            handleDisconnect();
        });
    }


    // ✅ 연결 끊김 처리 및 재연결
    function handleDisconnect() {
        clearInterval(heartbeatInterval);
        heartbeatInterval = null;
        clearTimeout(reconnectTimeout);

        reconnectAttempts++;
        const delay = reconnectAttempts === 1 ? 1000 : Math.min(10000, 1000 * reconnectAttempts);
        reconnectTimeout = setTimeout(connectWS, delay);
    }

    // ✅ 화면 복귀 시 자동 재연결
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && (!stompClient || !stompClient.connected)) {
            connectWS();
        }
    });

    // ✅ 주기적 상태 점검 (5분 주기)
    setInterval(() => {
        if (!stompClient || !stompClient.connected) connectWS();
    }, 300000);

    // ✅ 페이지 로드 시 자동 연결
    //window.addEventListener('load', connectWS);

    // ✅ 종료 시 정리
    window.addEventListener('beforeunload', () => {
        try {
            if (stompClient && stompClient.connected) stompClient.disconnect();
        } catch (_) { }
        clearInterval(heartbeatInterval);
        clearTimeout(reconnectTimeout);
    });
</script>
